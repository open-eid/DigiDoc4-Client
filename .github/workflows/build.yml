name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  BUILD_NUMBER: ${{ github.run_number }}
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  UBUNTU_DEPS: ./libdigidocpp-pkg/*.deb cmake libldap2-dev gettext libpcsclite-dev libssl-dev libgl-dev libqt6svg6-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libflatbuffers-dev libxml2-dev zlib1g-dev
jobs:
  macos:
    name: Build on macOS
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: 14.0
      LIBS_PATH: ${{ github.workspace }}/cache
    steps:
    - &Checkout
      name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        submodules: recursive
        persist-credentials: false
    - name: Download artifact
      uses: dawidd6/action-download-artifact@8305c0f1062bb0d184d09ef4493ecb9288447732 # v20
      with:
        workflow: build.yml
        branch: master
        name: macos
        path: libdigidocpp-pkg
        repo: open-eid/libdigidocpp
    - name: Install dependencies
      run: |
        brew install flatbuffers
        curl -O -sS --fail-with-body -L --retry 3 --proto '=https' --proto-redir '=https' https://installer.id.ee/media/github/opensc_0.26.1.pkg
        echo "db30c6dee3d362d3003f26a2f0478161f222e3074364de58d62e34ce247d31b1  opensc_0.26.1.pkg" | shasum -a 256 -c -
        sudo installer -verboseR -pkg libdigidocpp-pkg/build/macos/libdigidocpp*.pkg -target /
        sudo installer -verboseR -pkg opensc_*.pkg -target /
        rm -rf libdigidocpp-pkg
    - name: Cache libraries
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ env.LIBS_PATH }}
        key: vcpkg-macOS-${{ hashFiles('prepare_osx_build_environment.sh') }}
    - name: Build libraries
      run: |
        mkdir -p ${LIBS_PATH}/Qt-6.10.3-OpenSSL
        ./prepare_osx_build_environment.sh -p ${LIBS_PATH}
    - name: Install Qt
      uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
      with:
        version: 6.10.3
        arch: clang_64
        cache: true
    - name: Build
      run: |
        cmake "-GNinja" -B build -S . -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DOPENSSL_ROOT_DIR=${LIBS_PATH}/OpenSSL \
          -DLDAP_ROOT=${LIBS_PATH}/OpenLDAP \
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
        cmake --build build
        cmake --build build --target zipdebug
        cmake --build build --target macdeployqt
        cmake --build build --target zip
    - name: Archive artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: macOS
        path: build/qdigidoc4*.zip
  ubuntu:
    name: Build on Ubuntu ${{ matrix.container }} ${{ matrix.arch }}
    runs-on: ubuntu-24.04${{ matrix.arch == 'arm64' && '-arm' || '' }}
    timeout-minutes: 120
    container: ubuntu:${{ matrix.container }}
    strategy:
      matrix:
        container: ['22.04', '24.04', '26.04']
        arch: ['amd64', 'arm64']
    env:
      DEBIAN_FRONTEND: noninteractive
      DEBFULLNAME: github-actions
      DEBEMAIL: github-actions@github.com
    steps:
    - name: Download artifact
      uses: dawidd6/action-download-artifact@8305c0f1062bb0d184d09ef4493ecb9288447732 # v20
      with:
        workflow: build.yml
        branch: master
        name: ubuntu_${{ matrix.container }}_${{ matrix.arch }}
        path: libdigidocpp-pkg
        repo: open-eid/libdigidocpp
    - name: Install dependencies
      run: |
        for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
          [ -f "$f" ] && sed -i 's|http://archive.ubuntu.com|http://azure.archive.ubuntu.com|g; s|http://security.ubuntu.com|http://azure.archive.ubuntu.com|g' "$f"
        done
        echo 'path-exclude=/usr/share/man/*'      >  /etc/dpkg/dpkg.cfg.d/99-nodocs
        echo 'path-exclude=/usr/share/doc/*'      >> /etc/dpkg/dpkg.cfg.d/99-nodocs
        echo 'path-exclude=/usr/share/doc-base/*' >> /etc/dpkg/dpkg.cfg.d/99-nodocs
        apt update -qq && apt install --no-install-recommends -y git lsb-release build-essential devscripts debhelper pkg-config lintian ${UBUNTU_DEPS}
    - name: Install gcc 12
      if: matrix.container == '22.04'
      run: |
        apt install -y gcc-12 g++-12
        update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 60 --slave /usr/bin/g++ g++ /usr/bin/g++-12
        update-alternatives --set gcc /usr/bin/gcc-12
    - *Checkout
    - name: Setup changelog
      run: |
        export VERSION=$(grep project CMakeLists.txt | egrep -o "([0-9]{1,}\.)+[0-9]{1,}")
        export VERSIONEX=${VERSION}.${BUILD_NUMBER}.$(lsb_release -rs)
        dch --distribution $(lsb_release -cs) -v ${VERSIONEX} "Release ${VERSIONEX}."
    - name: Build packages
      run: |
        dpkg-buildpackage -us -uc
        mv ../qdigidoc4*.* .
    - name: Lintian
      run: lintian *.deb;
    - name: Archive artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ubuntu_${{ matrix.container }}_${{ matrix.arch }}
        path: qdigidoc4*.*
  fedora:
    name: Build on Fedora ${{ matrix.container }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: fedora:${{ matrix.container }}
    strategy:
      matrix:
        container: [43, 44]
    steps:
    - name: Download artifact
      uses: dawidd6/action-download-artifact@8305c0f1062bb0d184d09ef4493ecb9288447732 # v20
      with:
        workflow: build.yml
        branch: master
        name: fedora_${{ matrix.container }}
        path: libdigidocpp-pkg
        repo: open-eid/libdigidocpp
    - name: Install Deps
      run: dnf install -y ./libdigidocpp-pkg/*.rpm git gcc-c++ cmake rpm-build gettext openssl-devel openldap-devel pcsc-lite-devel qt6-qtsvg-devel qt6-qttools-devel flatbuffers-devel flatbuffers-compiler zlib-devel
    - *Checkout
    - name: Build
      run: |
        cmake -DCMAKE_INSTALL_PREFIX=/usr -B build -S .
        cmake --build build --target all package
    - name: Archive artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fedora_${{ matrix.container }}
        path: build/qdigidoc4*.rpm
  windows:
    name: Build on Windows
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      matrix:
        vcver: [143]
        platform: [x64, arm64]
    env:
      VER_SUFFIX: .VS${{ matrix.vcver }}
    steps:
    - *Checkout
    - name: Download artifact
      uses: dawidd6/action-download-artifact@8305c0f1062bb0d184d09ef4493ecb9288447732 # v20
      with:
        workflow: build.yml
        branch: master
        name: msi_${{ matrix.vcver }}_${{ matrix.platform }}
        path: ./
        repo: open-eid/libdigidocpp
    - name: Install artifact
      run: |
        Rename-Item "libdigidocpp*.msi" libdigidocpp.msi
        $r = Start-Process msiexec -ArgumentList '/a', 'libdigidocpp.msi', '/qn', "TARGETDIR=$env:GITHUB_WORKSPACE\libs", '/l*v', 'install.log' -Wait -PassThru
        if ($r.ExitCode -ne 0) { Get-Content install.log; exit $r.ExitCode }
    - name: Cache vcpkg
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-${{ matrix.vcver }}-${{ matrix.platform }}-${{ hashFiles('client/libcdoc/vcpkg.json') }}
    - name: Install Qt
      uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
      with:
        version: 6.11.1
        arch: ${{ matrix.platform == 'arm64' && 'win64_msvc2022_arm64_cross_compiled' || 'win64_msvc2022_64' }}
        cache: true
        aqtsource: git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e
    - name: Install WiX
      run: |
        dotnet tool install -g wix --version 6.0.2
        wix extension -g add WixToolset.UI.wixext/6.0.2
    - name: Build
      shell: cmd
      env:
        VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find VC\Auxiliary\Build\vcvarsall.bat`) do call "%%i" ${{ matrix.platform == 'arm64' && 'amd64_arm64' || 'amd64' }}
        set QT_HOST_PATH=%QT_HOST_PATH:\=/%
        cmake -GNinja -B build -S . -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake ^
          -DVCPKG_MANIFEST_DIR=${{ github.workspace }}/client/libcdoc ^
          -Dlibdigidocpp_ROOT=${{ github.workspace }}/libs/PFiles64 ^
          ${{ matrix.platform == 'arm64' && '-DQT_HOST_PATH=%QT_HOST_PATH%' || '' }}
        cmake --build build --target msi
        cmake --build build --target msishellext
        cmake --build build --target appx
    - name: Archive artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: msi_${{ matrix.vcver }}_${{ matrix.platform }}
        path: |
          build/*.msi
          build/*.appx
  coverity:
    name: Run Coverity tests
    if: github.repository == 'open-eid/DigiDoc4-Client' && contains(github.ref, 'coverity_scan')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - *Checkout
    - name: Download artifact
      uses: dawidd6/action-download-artifact@8305c0f1062bb0d184d09ef4493ecb9288447732 # v20
      with:
        workflow: build.yml
        branch: master
        name: ubuntu_24.04_amd64
        path: libdigidocpp-pkg
        repo: open-eid/libdigidocpp
    - name: Install dependencies
      run: sudo apt update -qq && sudo apt install --no-install-recommends -y ${UBUNTU_DEPS}
    - name: Download Coverity Build Tool
      env:
        TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
        PROJECTNAME: open-eid/DigiDoc4-Client
      run: |
        curl -sS --fail-with-body -L --retry 3 --proto '=https' --proto-redir '=https' \
          --data-urlencode "token=${TOKEN}" \
          --data-urlencode "project=${PROJECTNAME}" \
          -o cov-analysis-linux64.tar.gz \
          https://scan.coverity.com/download/linux64
    - name: Build
      run: |
        cmake .
        mkdir cov-analysis-linux64
        tar xzf cov-analysis-linux64.tar.gz --strip 1 -C cov-analysis-linux64
        export PATH=$PWD/cov-analysis-linux64/bin:$PATH
        cov-build --dir cov-int make
        tar czvf upload.tgz cov-int
    - name: Submit the result to Coverity Scan
      env:
        TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
        PROJECTNAME: open-eid/DigiDoc4-Client
      run: |
        curl -sS --fail-with-body -L --retry 3 --proto '=https' --proto-redir '=https' \
          -F project=$PROJECTNAME \
          -F token=$TOKEN \
          -F email=eid-teenusehaldus@ria.ee \
          -F file=@upload.tgz \
          -F version=master \
          -F description="Github Actions CI build" \
          https://scan.coverity.com/builds?project=$PROJECTNAME
  codeql:
    name: Run CodeQL tests
    if: github.repository == 'open-eid/DigiDoc4-Client'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      security-events: write
    steps:
    - *Checkout
    - name: Download artifact
      uses: dawidd6/action-download-artifact@8305c0f1062bb0d184d09ef4493ecb9288447732 # v20
      with:
        workflow: build.yml
        branch: master
        name: ubuntu_24.04_amd64
        path: libdigidocpp-pkg
        repo: open-eid/libdigidocpp
    - name: Install dependencies
      run: sudo apt update -qq && sudo apt install --no-install-recommends -y ${UBUNTU_DEPS}
    - name: Initialize CodeQL
      uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
      with:
        languages: cpp
        queries: +security-and-quality
    - name: Autobuild
      uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
      with:
        upload: False
        output: sarif-results
    - name: Filter results
      uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # v1.1
      with:
        patterns: |
          -**/*autogen*/**
          -**/common/qtsingleapplication/**
          -**:cpp/loop-variable-changed
          -**:cpp/poorly-documented-function
        input: sarif-results/cpp.sarif
        output: sarif-results/cpp.sarif
    - name: Upload results
      uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
      with:
        sarif_file: sarif-results/cpp.sarif
