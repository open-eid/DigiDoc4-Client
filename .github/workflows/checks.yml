name: Checks
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  checks:
    uses: open-eid/.github/.github/workflows/checks.yml@fcc10a5288079edae6cf554759e675a8bf66d5d6 # master
    with:
      # Qt Linguist translations share the .ts extension with TypeScript
      exclude: '^client/translations/.*\.ts$'
